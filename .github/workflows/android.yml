# Builds the signed Android APK. A pushed tag like v0.2.0 publishes it as a GitHub Release.
name: Android

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npm run build && npx cap sync android
      - name: Build signed APK
        env:
          DG_KEYSTORE: ${{ runner.temp }}/release.jks
          DG_KEY_ALIAS: freediscgolf
          DG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DG_VERSION_CODE: ${{ github.run_number }}
          DG_VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('0.0.{0}', github.run_number) }}
        run: |
          echo '${{ secrets.ANDROID_KEYSTORE_B64 }}' | base64 -d > "$DG_KEYSTORE"
          cd android && ./gradlew --no-daemon assembleRelease
          mv app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/free-disc-golf-$DG_VERSION_NAME.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: free-disc-golf-*.apk
      - if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" free-disc-golf-*.apk --title "Free Disc Golf $GITHUB_REF_NAME" --notes "Android app. Download the .apk on your phone, open it, and allow installs from your browser when asked."
