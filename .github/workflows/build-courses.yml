# Weekly rebuild of public/courses.json from OpenStreetMap (ODbL). Commits only when the data changed.
name: Build course data

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-courses
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build:courses
      - name: Commit if changed
        run: |
          git diff --quiet -- public/courses.json && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/courses.json
          git commit -m 'chore(data): weekly OpenStreetMap course rebuild'
          git push
